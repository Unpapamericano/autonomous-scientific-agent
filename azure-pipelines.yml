trigger:
- main

pr:
- main

pool:
  vmImage: ubuntu-latest

stages:
- stage: Validate
  displayName: Validate application and infrastructure
  jobs:
  - job: Tests
    steps:
    - checkout: self
    - task: UsePythonVersion@0
      inputs:
        versionSpec: '3.11'
    - script: |
        python -m pip install --upgrade pip
        pip install -r requirements-dev.txt
        pytest -q
      displayName: Run Python tests
    - bash: |
        test -f infra/azure/main.tf
        test -f infra/azure/variables.tf
        test -f infra/azure/outputs.tf
        grep -q 'azurerm_virtual_network' infra/azure/main.tf
      displayName: Check Terraform Azure template

- stage: Security
  displayName: Security and secret checks
  dependsOn: Validate
  jobs:
  - job: StaticChecks
    steps:
    - checkout: self
    - pwsh: ./ops/Validate-Delivery.ps1
      displayName: Run PowerShell delivery checks
