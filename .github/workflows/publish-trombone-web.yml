name: Publish Trombone Web App

on:
  push:
    branches: ["main"]
    paths:
      - "web/trombone/**"
      - "data/trombone_repertoire.json"
      - ".github/workflows/publish-trombone-web.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Prepare site
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p _site/web/trombone _site/data
          cp web/trombone/index.html _site/web/trombone/index.html
          cp data/trombone_repertoire.json _site/data/trombone_repertoire.json
          cat > _site/.nojekyll <<'EOF'
          EOF
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
